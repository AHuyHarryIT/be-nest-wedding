services:
  db:
    image: postgres:16-alpine
    container_name: studio-hamy-backend-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    ports:
      - "5432:5432"
    volumes:
      - backend_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: studio-hamy-backend-dev
    restart: unless-stopped
    command:
      - sh
      - -c
      - if [ ! -d node_modules/.bin ]; then npm ci; fi && export DATABASE_URL="postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-appdb}" && npx prisma generate && npm run start:dev
    env_file:
      - .env.dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "300"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-appdb}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-this-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:3000}
      MOMO_BASE_URL: ${MOMO_BASE_URL:-http://localhost:3000}
      MOMO_REDIRECT_URL: ${MOMO_REDIRECT_URL:-http://localhost:5174/bookings/payment-result}
      MOMO_IPN_URL: ${MOMO_IPN_URL:-http://localhost:3000/orders/momo/callback}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-local-dev-client-id}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-local-dev-client-secret}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-local-dev-tenant-id}
      AZURE_USER_ID: ${AZURE_USER_ID:-local-dev-user-id}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
      - backend_generated:/app/generated

volumes:
  backend_db_data:
  backend_node_modules:
  backend_generated:
